server {
  # 3000 matches the port the rest of the fleet's services listen on, and is what
  # the foundation.pencloud.uk domain routes to. 80 stays open because it is the
  # port recorded on the Shipyard service, which is what the deploy health check hits.
  listen 3000;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Fingerprinted build assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /img/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
